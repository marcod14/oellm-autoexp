# @package _global_
# 0.1B non-embedding Qwen3-style masked diffusion LM (multilingual_scaling 0.1B_ne architecture).
# python scripts/run_autoexp.py --config-name experiments/dllm/qwen3_0.1B_ne_dlm

defaults:
  - /backend: megadlm_torchrun
  - /container: leonardo
  - /slurm: leonardo
  - /job: default
  - /sweep: none
  - override /backend/megatron: dllm/qwen3_0.1B_ne_dlm
  - _self_

job:
  name: "qwen3_0.1B_ne_dlm"
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${job.name}"
  log_path: ${.base_output_dir}/logs/slurm-%j.log
  log_path_current: ${.base_output_dir}/logs/current.log
  config_path: ${.base_output_dir}/logs/config-%j.yaml
  config_path_current: ${.base_output_dir}/logs/current.yaml

backend:
  # Same MegaDLMs flags as qwen3_125M_dlm (see that file for what each does).
  aux:
    difflm_args: "--attention-mask-type no_mask --mask-token ${backend.megatron.aux.mask_token_id} --base-model vanilla --model-running-mode difflm-noshift --difflm-varilen-prob 0.01 --mask-prob 0.15 --wandb-exp-name ${job.name} --wandb-mode offline"
  megatron:
    global_batch_size: 512
    wandb_project: "scaling_laws"
    data_cache_path: /leonardo_work/PHD_dallari/cache

slurm:
  sbatch:
#    _non_strict: true
    nodes: 1
    ntasks: 1
    gpus_per_node: 1
    exclusive: true
    partition: boost_usr_prod
    time: "00:10:00"
    qos: boost_qos_dbg
    account: PHD_dallari
