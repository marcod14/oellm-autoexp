defaults:
 - /backend/megatron/qwen3_base@_here_

num_layers: 16
hidden_size: 512
ffn_hidden_size: 2048
num_attention_heads: 4
num_query_groups: 4
kv_channels: 128
untie_embeddings_and_output_weights: False

seq_length: 4097
max_position_embeddings: 4097

train_iters: 9536
#micro_batch_size: 8
micro_batch_size: 4 # to run on single gpu
lr: 6.0e-4

# Disable fusions that conflict with diffusion or require TE >= 1.4
bias_gelu_fusion: false
bias_dropout_fusion: false
bias_swiglu_fusion: false
apply_rope_fusion: false

aux:
  model_name: "megadlm-125m"
  mask_token_id: 147

tokenizer_type: HuggingFaceTokenizer
tokenizer_model: /leonardo_work/PHD_dallari/tokenizers/tokenizer-256k   #va modificato

data_path:
  - /leonardo_work/PHD_dallari/fineweb-10BT_text_document
data_cache_path: /leonardo_work/PHD_dallari/cache
save: ${job.base_output_dir}/checkpoints
wandb_save_dir: ${job.base_output_dir}/wandb
tensorboard_dir: ${job.base_output_dir}/tensorboard
save_interval: 1000
eval_interval: 1001
eval_iters: 101
log_interval: 10
log_throughput: true
log_timers_to_tensorboard: true
use_flash_attn: true
